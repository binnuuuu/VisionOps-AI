services:
  anomalib:
    build:
      context: .
      dockerfile: backend/Dockerfile.anomalib
    environment:
      VISIONOPS_DATA_DIR: /app/data
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./datasets:/app/datasets
    profiles:
      - ml
